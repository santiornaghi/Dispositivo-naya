<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Volumen — prototipo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.4;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  .subtitulo { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; padding: 1rem; }
  legend { font-weight: 600; padding: 0 0.4rem; }
  label { display: block; margin: 0.4rem 0 0.15rem; font-size: 0.85rem; }
  select, input[type=text] { padding: 0.4rem; width: 100%; box-sizing: border-box; }
  button {
    padding: 0.7rem 1.2rem; border-radius: 6px; border: 1px solid #8884;
    cursor: pointer; background: #6c63ff; color: white; font-weight: 600;
    font-size: 1rem; min-height: 44px; /* touch target */
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secundario { background: transparent; color: inherit; }
  button.grabando { background: #e53e3e; }
  .estado-grabacion { font-size: 0.9rem; margin: 0.6rem 0; }
  details { margin-top: 0.8rem; font-size: 0.85rem; }
  summary { cursor: pointer; color: #6c63ff; }
  .mensaje { background: #6c63ff22; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.9rem; margin: 0.6rem 0; }
  .categoria { margin-bottom: 1rem; }
  .categoria-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .categoria-nombre { font-weight: 600; }
  input[type=range] { width: 100%; }
  .aviso-nuevo { color: #d69e2e; font-size: 0.8rem; }
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #222; color: white; padding: 0.6rem 1rem; border-radius: 8px;
    font-size: 0.85rem; display: none; align-items: center; gap: 0.6rem;
  }
  .toast.visible { display: flex; }
  .toast button { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .fila-controles { display: flex; gap: 0.6rem; margin-top: 0.8rem; }
</style>
</head>
<body>
  <h1>Modo Volumen — prototipo</h1>
  <div class="subtitulo">
    Grabá un fragmento y el modelo lo separa en voces reales
    (soprano/alto/tenor/bajo) — no es una lista de tracks de ejemplo, es tu
    propio audio.
  </div>

  <fieldset>
    <legend>1. Grabá y cargá un perfil</legend>

    <label for="perfil">Nombre del perfil (coro, lugar, grupo de ensayo)</label>
    <input type="text" id="perfil" placeholder="ej. Coro San Martín">

    <div class="fila-controles">
      <button id="btnGrabar">🎙 Grabar</button>
      <button id="btnDetener" class="secundario" disabled>■ Detener</button>
    </div>
    <div id="estadoGrabacion" class="estado-grabacion"></div>

    <details>
      <summary>o probar con un track de ejemplo ya separado</summary>
      <label for="track">Track</label>
      <select id="track"></select>
      <div class="fila-controles">
        <button id="btnCargar" class="secundario">Cargar ejemplo</button>
      </div>
    </details>
  </fieldset>

  <div id="mensaje" class="mensaje" style="display:none"></div>

  <fieldset id="fieldsetCategorias" style="display:none">
    <legend>2. Mezclá</legend>
    <div id="categorias"></div>
    <div class="fila-controles">
      <button id="btnPlay">▶ Reproducir</button>
      <button id="btnStop" class="secundario" disabled>■ Parar</button>
    </div>
  </fieldset>

  <div id="toast" class="toast">
    <span>Cambio grande — ¿restaurar el ajuste anterior?</span>
    <button id="btnRestaurarToast">Restaurar</button>
  </div>

<script>
const dbToLinear = db => Math.pow(10, db / 20);

let audioCtx = null;
let buffers = {};       // categoria -> AudioBuffer
let gainNodes = {};     // categoria -> GainNode
let sources = [];       // BufferSourceNode activos
let trackActual = null;
let perfilActual = null;
let ajustesActuales = {};
let toastTimeout = null;

const $ = id => document.getElementById(id);

async function cargarTracks() {
  const res = await fetch('/api/tracks');
  const tracks = await res.json();
  const sel = $('track');
  sel.innerHTML = tracks.map(t => `<option value="${t}">${t}</option>`).join('');
}

function ocultarToast() {
  $('toast').classList.remove('visible');
  clearTimeout(toastTimeout);
}

function mostrarToastCambioGrande() {
  $('toast').classList.add('visible');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(ocultarToast, 6000);
}

function renderSliders() {
  const cont = $('categorias');
  cont.innerHTML = '';
  for (const [categoria, db] of Object.entries(ajustesActuales)) {
    const div = document.createElement('div');
    div.className = 'categoria';
    div.innerHTML = `
      <div class="categoria-header">
        <span class="categoria-nombre">${categoria}</span>
        <span id="valor-${categoria}">${db.toFixed(1)} dB</span>
      </div>
      <input type="range" id="slider-${categoria}" min="-24" max="6" step="0.5" value="${db}">
    `;
    cont.appendChild(div);

    const slider = div.querySelector('input');
    slider.addEventListener('input', () => {
      const val = parseFloat(slider.value);
      $(`valor-${categoria}`).textContent = `${val.toFixed(1)} dB`;
      if (gainNodes[categoria] && audioCtx) {
        gainNodes[categoria].gain.setValueAtTime(dbToLinear(val), audioCtx.currentTime);
      }
    });
    slider.addEventListener('change', async () => {
      const val = parseFloat(slider.value);
      const res = await fetch(`/api/perfil/${encodeURIComponent(perfilActual)}/ajuste`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ categoria, valor_db: val }),
      });
      const data = await res.json();
      ajustesActuales = data.ajustes_db;
      if (data.cambio_grande) mostrarToastCambioGrande();
    });
  }
}

async function cargarPerfilParaTrack(track, perfil) {
  trackActual = track;
  perfilActual = perfil;

  const res = await fetch(`/api/perfil/${encodeURIComponent(perfil)}?track=${encodeURIComponent(track)}`);
  const data = await res.json();

  ajustesActuales = data.ajustes_db;
  $('mensaje').style.display = 'block';
  let html = data.mensaje;
  if (data.categorias_nuevas.length) {
    html += `<div class="aviso-nuevo">Categorías nuevas en este track: ${data.categorias_nuevas.join(', ')} (entran en 0dB hasta que las ajustes)</div>`;
  }
  $('mensaje').innerHTML = html;

  renderSliders();
  $('fieldsetCategorias').style.display = 'block';

  // pre-cargar el audio para que "Reproducir" arranque sin demora
  await precargarAudio(track, Object.keys(ajustesActuales));
}

$('btnCargar').addEventListener('click', async () => {
  const track = $('track').value;
  const perfil = $('perfil').value.trim();
  if (!track || !perfil) { alert('Elegí un track y escribí un nombre de perfil.'); return; }
  await cargarPerfilParaTrack(track, perfil);
});

async function precargarAudio(track, categorias) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  buffers = {};
  gainNodes = {};
  for (const categoria of categorias) {
    const res = await fetch(`/api/audio/${encodeURIComponent(track)}/${encodeURIComponent(categoria)}`);
    const arrayBuffer = await res.arrayBuffer();
    buffers[categoria] = await audioCtx.decodeAudioData(arrayBuffer);
    const gain = audioCtx.createGain();
    gain.gain.value = dbToLinear(ajustesActuales[categoria] ?? 0);
    gain.connect(audioCtx.destination);
    gainNodes[categoria] = gain;
  }
}

function pararReproduccion() {
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = [];
  $('btnPlay').disabled = false;
  $('btnStop').disabled = true;
}

$('btnPlay').addEventListener('click', () => {
  if (!Object.keys(buffers).length) { alert('Cargá un perfil primero.'); return; }
  pararReproduccion();
  const inicio = audioCtx.currentTime + 0.1;
  for (const [categoria, buffer] of Object.entries(buffers)) {
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(gainNodes[categoria]);
    src.start(inicio);
    src.onended = () => {
      sources = sources.filter(s => s !== src);
      if (sources.length === 0) { $('btnPlay').disabled = false; $('btnStop').disabled = true; }
    };
    sources.push(src);
  }
  $('btnPlay').disabled = true;
  $('btnStop').disabled = false;
});

$('btnStop').addEventListener('click', pararReproduccion);

$('btnRestaurarToast').addEventListener('click', async () => {
  const res = await fetch(`/api/perfil/${encodeURIComponent(perfilActual)}/restaurar`, { method: 'POST' });
  const data = await res.json();
  if (data.restaurado) {
    ajustesActuales = data.ajustes_db;
    renderSliders();
    for (const [categoria, db] of Object.entries(ajustesActuales)) {
      if (gainNodes[categoria]) gainNodes[categoria].gain.setValueAtTime(dbToLinear(db), audioCtx.currentTime);
    }
  }
  ocultarToast();
});

// --- grabación de mic + encoding WAV en el navegador ---
// Se usa ScriptProcessorNode (no MediaRecorder) a propósito: MediaRecorder no
// tiene soporte confiable de WAV/PCM en todos los navegadores (Safari iOS
// especialmente), y acá conviene mandar WAV directo — el servidor lo lee con
// soundfile sin depender de ffmpeg (que no está instalado en esta máquina).
let micStream = null;
let micCtx = null;
let micProcessor = null;
let chunksGrabados = [];
let segundosGrabados = 0;
let timerGrabacion = null;

function codificarWAV(muestras, sampleRate) {
  const buffer = new ArrayBuffer(44 + muestras.length * 2);
  const view = new DataView(buffer);
  const escribirStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  escribirStr(0, 'RIFF');
  view.setUint32(4, 36 + muestras.length * 2, true);
  escribirStr(8, 'WAVE');
  escribirStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  escribirStr(36, 'data');
  view.setUint32(40, muestras.length * 2, true);
  let offset = 44;
  for (let i = 0; i < muestras.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, muestras[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

async function empezarGrabacion() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const fuente = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  chunksGrabados = [];

  micProcessor.onaudioprocess = (e) => {
    chunksGrabados.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  // conectar a un gain en 0 -> mantiene vivo el processor sin retorno audible del mic
  const gainMudo = micCtx.createGain();
  gainMudo.gain.value = 0;
  fuente.connect(micProcessor);
  micProcessor.connect(gainMudo);
  gainMudo.connect(micCtx.destination);

  segundosGrabados = 0;
  $('estadoGrabacion').textContent = 'Grabando... 0s (recomendado: hasta 30s, más tarda más en procesar)';
  timerGrabacion = setInterval(() => {
    segundosGrabados++;
    $('estadoGrabacion').textContent = `Grabando... ${segundosGrabados}s (recomendado: hasta 30s)`;
  }, 1000);

  $('btnGrabar').disabled = true;
  $('btnGrabar').classList.add('grabando');
  $('btnDetener').disabled = false;
}

async function detenerYSubirGrabacion() {
  clearInterval(timerGrabacion);
  micProcessor.disconnect();
  micStream.getTracks().forEach(t => t.stop());
  const sampleRate = micCtx.sampleRate;
  const ctxCerrado = micCtx.close();

  $('btnGrabar').disabled = false;
  $('btnGrabar').classList.remove('grabando');
  $('btnDetener').disabled = true;

  const largoTotal = chunksGrabados.reduce((acc, c) => acc + c.length, 0);
  const muestras = new Float32Array(largoTotal);
  let pos = 0;
  for (const c of chunksGrabados) { muestras.set(c, pos); pos += c.length; }

  const wavBlob = codificarWAV(muestras, sampleRate);

  $('estadoGrabacion').textContent = 'Subiendo grabación...';
  const form = new FormData();
  form.append('audio', wavBlob, 'grabacion.wav');
  const res = await fetch('/api/grabaciones', { method: 'POST', body: form });
  const data = await res.json();

  $('estadoGrabacion').textContent = 'Separando tu audio en voces (soprano/alto/tenor/bajo)... puede tardar unos minutos.';
  await esperarSeparacion(data.id);
}

async function esperarSeparacion(idGrabacion) {
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    const res = await fetch(`/api/grabaciones/${encodeURIComponent(idGrabacion)}/estado`);
    const data = await res.json();
    if (data.estado === 'listo') {
      $('estadoGrabacion').textContent = 'Separación lista.';
      const perfil = $('perfil').value.trim() || 'Sin nombre';
      await cargarPerfilParaTrack(idGrabacion, perfil);
      return;
    }
    if (data.estado === 'error') {
      $('estadoGrabacion').textContent = 'Hubo un error separando el audio — mirá flask.log en el servidor.';
      return;
    }
  }
}

$('btnGrabar').addEventListener('click', async () => {
  try {
    await empezarGrabacion();
  } catch (err) {
    $('estadoGrabacion').textContent = `No se pudo acceder al micrófono: ${err.message}`;
  }
});

$('btnDetener').addEventListener('click', detenerYSubirGrabacion);

cargarTracks();
</script>
</body>
</html>
